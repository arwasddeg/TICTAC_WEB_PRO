<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة ساعة جديدة | TICTAC Admin</title>
    <style>
        :root {
            --primary-bg: linear-gradient(to right bottom, #2b6081, #14425f, #030f16, #03111e, #031f30, #3065a5, #2e4968);
            --card-bg: rgba(255, 255, 255, 0.07);
            --accent-color: #00d4ff;
            --text-color: #e5e7eb;
        }

        body {
            font-family: "Times New Roman", serif;
            background: var(--primary-bg);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 { text-align: center; color: var(--accent-color); margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-weight: bold; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus { border-color: var(--accent-color); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
    </style>
</head>
<body>

<div class="form-container">
    <h2>إضافة ساعة جديدة</h2>
    <form action="save_product.php" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>اسم الساعة</label>
            <input type="text" name="product_name" placeholder="مثلاً: Chrono Luxury" required>
        </div>

        <div class="form-group">
            <label>الفئة</label>
            <select name="category">
                <option value="modern">ساعات حديثة</option>
                <option value="sport">ساعات رياضية</option>
            </select>
        </div>

        <div class="form-group">
            <label>السعر (€)</label>
            <input type="number" name="price" placeholder="599" required>
        </div>

        <div class="form-group">
            <label>وصف الساعة</label>
            <textarea name="description" rows="3" placeholder="اكتب تفاصيل الساعة..."></textarea>
        </div>

        <div class="form-group">
            <label>صورة الساعة</label>
            <input type="file" name="product_image" accept="image/*" required>
        </div>

        <button type="submit" class="btn-submit">حفظ ونشر الساعة</button>
    </form>
</div>

</body>
</html>
